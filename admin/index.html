<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Dot Drive — Admin</title><style>body{font-family:Inter,Arial,sans-serif;background:#faf6f0;color:#211c18;margin:0;padding:32px}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border:1px solid #ddd5cb;border-radius:14px;padding:20px;margin:16px 0}input,button{padding:11px 13px;border-radius:9px;border:1px solid #ccc;font-size:14px}button{cursor:pointer;font-weight:600}.primary{background:#211c18;color:#fff}.danger{background:#fff;color:#8e1329}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #eee;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#6a625b}</style></head><body><div class="wrap"><h1>Red Dot Drive — Donation Verification</h1><div id="login" class="card"><h2>Admin sign in</h2><input id="email" type="email" placeholder="Admin email"><br><br><input id="password" type="password" placeholder="Password"><br><br><button class="primary" onclick="signIn()">Sign in</button><p id="loginMsg" class="muted"></p></div><div id="app" style="display:none"><div class="card"><button class="primary" onclick="loadPending()">Refresh</button> <button onclick="signOut()">Sign out</button><p id="summary" class="muted"></p></div><div class="card"><h2>Pending donations</h2><div id="list"></div></div></div></div><script src="/config.js"></script><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient(window.__SUPABASE_URL__,window.__SUPABASE_PUBLISHABLE_KEY__),$=id=>document.getElementById(id);async function signIn(){const{error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').textContent=error.message;return}showApp()}async function signOut(){await sb.auth.signOut();location.reload()}async function showApp(){const{data:{user}}=await sb.auth.getUser();if(!user)return;$('login').style.display='none';$('app').style.display='block';loadPending()}async function loadPending(){const{data,error}=await sb.rpc('admin_list_pending_donations');if(error){$('list').textContent=error.message;return}$('summary').textContent=`${data.length} pending donation(s)`;$('list').innerHTML=data.length?`<table><tr><th>Created</th><th>Amount</th><th>Donor</th><th>Transaction note</th><th>Shared</th><th>Action</th></tr>${data.map(d=>`<tr><td>${new Date(d.created_at).toLocaleString('en-IN')}</td><td><strong>₹${Number(d.amount).toLocaleString('en-IN')}</strong></td><td>${esc(d.donor_name||'Anonymous')}</td><td>${esc(d.transaction_note||'—')}</td><td>${d.transaction_shared_at?'Yes':'No'}</td><td><div class="actions"><button class="primary" onclick="verify('${d.id}')">Verify</button><button class="danger" onclick="rejectDonation('${d.id}')">Reject</button></div></td></tr>`).join('')}</table>`:'<p class="muted">No pending donations.</p>'}async function verify(id){const{error}=await sb.rpc('verify_donation',{p_donation_id:id});if(error)alert(error.message);else loadPending()}async function rejectDonation(id){const reason=prompt('Reason for rejection (optional):')||null;const{error}=await sb.rpc('reject_donation',{p_donation_id:id,p_reason:reason});if(error)alert(error.message);else loadPending()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}window.signIn=signIn;window.signOut=signOut;window.loadPending=loadPending;window.verify=verify;window.rejectDonation=rejectDonation;sb.auth.getSession().then(({data:{session}})=>{if(session)showApp()});</script></body></html>
